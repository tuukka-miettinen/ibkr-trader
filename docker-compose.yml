services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trader
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trading123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-ibkr}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://postgres:trading123@db:5432/trader}
      IBKR_HOST: ${IBKR_HOST:-host.docker.internal}
      IBKR_PORT: ${IBKR_PORT:-4004}
      IBKR_CLIENT_ID: ${IBKR_CLIENT_ID:-101}
      IBKR_EXCHANGE: ${IBKR_EXCHANGE:-SMART}
      IBKR_CURRENCY: ${IBKR_CURRENCY:-USD}
      IBKR_USE_RTH: ${IBKR_USE_RTH:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
