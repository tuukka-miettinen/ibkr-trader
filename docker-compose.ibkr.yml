volumes:
  ibgateway_settings:

services:
  ib-gateway-init:
    image: alpine:latest
    command: ["chown", "-R", "1000:1000", "/tws_settings"]
    volumes:
      - ibgateway_settings:/tws_settings
    restart: "no"

  novnc:
    build:
      context: .
      dockerfile: novnc/Dockerfile
    environment:
      NOVNC_LISTEN_PORT: 6080
      NOVNC_VNC_HOST: ib-gateway
      NOVNC_VNC_PORT: 5900
    ports:
      - "6080:6080"
    depends_on:
      - ib-gateway
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6080/vnc.html')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    depends_on:
      ib-gateway-init:
        condition: service_completed_successfully
    environment:
      TWS_USERID: ${TWS_USERID:-}
      TWS_PASSWORD: ${TWS_PASSWORD:-}
      TRADING_MODE: ${IBKR_TRADING_MODE:-paper}
      READ_ONLY_API: ${READ_ONLY_API:-no}
      TWS_ACCEPT_INCOMING: ${TWS_ACCEPT_INCOMING:-accept}
      VNC_SERVER_PASSWORD: ${VNC_SERVER_PASSWORD:-}
      TWOFA_TIMEOUT_ACTION: ${TWOFA_TIMEOUT_ACTION:-restart}
      AUTO_RESTART_TIME: ${AUTO_RESTART_TIME:-}
      RELOGIN_AFTER_TWOFA_TIMEOUT: ${RELOGIN_AFTER_TWOFA_TIMEOUT:-yes}
      EXISTING_SESSION_DETECTED_ACTION: ${EXISTING_SESSION_DETECTED_ACTION:-primary}
      TIME_ZONE: ${TIME_ZONE:-Etc/UTC}
      TWS_SETTINGS_PATH: ${TWS_SETTINGS_PATH:-/home/ibgateway/tws_settings}
    volumes:
      - ibgateway_settings:/home/ibgateway/tws_settings
    ports:
      - "127.0.0.1:4003:4003"
      - "127.0.0.1:4004:4004"
      - "127.0.0.1:5900:5900"
    restart: unless-stopped